[workspace]
resolver = "2"
members = [
    "runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AetherCraft Team <team@aethercraft.net>"]
license = "MIT"
repository = "https://github.com/aethercraft/aethercraft"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.10"
blake3 = "1.5"
colored = "2.1"
