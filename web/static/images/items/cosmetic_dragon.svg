<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="dragonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dragonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="dragonHorn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowDragon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#dragonGlow)"/>

  <!-- Dragon Head & Wings -->
  <g filter="url(#shadowDragon)">
    <!-- Small Dragon Wings -->
    <path d="M160 160 C120 110 80 120 60 150 C70 180 110 190 145 185 Z" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M240 160 C280 110 320 120 340 150 C330 180 290 190 255 185 Z" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>

    <!-- Dragon Head Base -->
    <path d="M160 180 C140 220 145 260 200 280 C255 260 260 220 240 180 C230 150 170 150 160 180 Z" 
          fill="url(#dragonSkin)" stroke="#ddd6fe" stroke-width="3"/>

    <!-- Snout & Mouth -->
    <ellipse cx="200" cy="245" rx="32" ry="24" fill="#5b21b6" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="190" cy="242" r="3.5" fill="#fef08a"/>
    <circle cx="210" cy="242" r="3.5" fill="#fef08a"/>

    <!-- Cute Celestial Eyes -->
    <ellipse cx="178" cy="195" rx="14" ry="18" fill="#06070b" stroke="#fef08a" stroke-width="2"/>
    <circle cx="175" cy="190" r="6" fill="#fef08a"/>
    <circle cx="180" cy="200" r="2.5" fill="#ffffff"/>

    <ellipse cx="222" cy="195" rx="14" ry="18" fill="#06070b" stroke="#fef08a" stroke-width="2"/>
    <circle cx="225" cy="190" r="6" fill="#fef08a"/>
    <circle cx="220" cy="200" r="2.5" fill="#ffffff"/>

    <!-- Curved Golden Horns -->
    <path d="M165 160 C150 130 130 110 115 105 C130 125 145 145 155 165 Z" fill="url(#dragonHorn)" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M235 160 C250 130 270 110 285 105 C270 125 255 145 245 165 Z" fill="url(#dragonHorn)" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Small Dragon Chest Scales -->
    <path d="M190 270 Q200 285 210 270" stroke="#fef08a" stroke-width="2" fill="none"/>
  </g>

  <!-- Mystic Floating Embers -->
  <circle cx="140" cy="110" r="4" fill="#fef08a" filter="drop-shadow(0 0 5px #f59e0b)"/>
  <circle cx="260" cy="110" r="4" fill="#fef08a" filter="drop-shadow(0 0 5px #f59e0b)"/>
  <circle cx="200" cy="325" r="5" fill="#a78bfa"/>
</svg>