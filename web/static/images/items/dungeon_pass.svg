<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="dungeonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <filter id="shadowPass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#dungeonGlow)"/>

  <!-- Dungeon Pass Card / Sigil -->
  <g filter="url(#shadowPass)" transform="rotate(-8 200 200)">
    <!-- Ticket Body -->
    <rect x="90" y="110" width="220" height="180" rx="24" fill="url(#ticketGrad)" stroke="#7dd3fc" stroke-width="3"/>
    
    <!-- Cutouts -->
    <circle cx="90" cy="200" r="16" fill="#06070b"/>
    <circle cx="310" cy="200" r="16" fill="#06070b"/>

    <!-- Inner Golden Border -->
    <rect x="110" y="130" width="180" height="140" rx="14" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Boss Gate Portal Motif -->
    <circle cx="200" cy="200" r="40" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="200,175 212,195 225,200 212,205 200,225 188,205 175,200 188,195" fill="#fef08a"/>
    <circle cx="200" cy="200" r="6" fill="#f43f5e"/>
  </g>

  <!-- Floating Keys & Sparks -->
  <polygon points="200,35 204,46 215,48 205,52 200,62 195,52 185,48 196,46" fill="#7dd3fc"/>
  <polygon points="85,85 88,93 96,95 89,97 86,105 83,97 75,95 83,93" fill="#fef08a"/>
</svg>
