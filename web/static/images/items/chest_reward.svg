<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291003"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowChest" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#chestGlow)"/>

  <!-- Chest Body -->
  <g filter="url(#shadowChest)">
    <!-- Base Box -->
    <rect x="90" y="190" width="220" height="110" rx="12" fill="url(#chestWood)" stroke="#f59e0b" stroke-width="4"/>
    
    <!-- Chest Lid (Slightly Angled Open) -->
    <path d="M80 185 C80 145 120 120 200 120 C280 120 320 145 320 185 Z" 
          fill="url(#chestWood)" stroke="#f59e0b" stroke-width="4"/>

    <!-- Gold Bands & Reinforcements -->
    <rect x="120" y="125" width="24" height="175" fill="url(#chestGold)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="256" y="125" width="24" height="175" fill="url(#chestGold)" stroke="#fef08a" stroke-width="1.5"/>
    
    <!-- Center Glowing Lock / Heart -->
    <rect x="180" y="170" width="40" height="45" rx="8" fill="#18181b" stroke="url(#chestGold)" stroke-width="3"/>
    <circle cx="200" cy="188" r="7" fill="#fef08a"/>
    <polygon points="197,188 203,188 205,202 195,202" fill="#fef08a"/>

    <!-- 30m Cosmic Rune Badge -->
    <circle cx="200" cy="150" r="18" fill="#06070b" stroke="#fef08a" stroke-width="2"/>
    <text x="200" y="156" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">30m</text>
  </g>

  <!-- Bursting Golden Coins / Stars -->
  <polygon points="200,60 204,74 218,77 204,80 200,94 196,80 182,77 196,74" fill="#fef08a"/>
  <circle cx="110" cy="95" r="12" fill="url(#chestGold)" stroke="#fef08a" stroke-width="2"/>
  <text x="110" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#451a03" text-anchor="middle">⛁</text>

  <circle cx="290" cy="95" r="12" fill="url(#chestGold)" stroke="#fef08a" stroke-width="2"/>
  <text x="290" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#451a03" text-anchor="middle">⛁</text>

  <circle cx="70" cy="200" r="4" fill="#fef08a"/>
  <circle cx="330" cy="200" r="4" fill="#fef08a"/>
</svg>