<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="foxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadowFox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#foxGlow)"/>

  <!-- Lunar Eclipse Ring -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8"/>

  <!-- 3 Astral Comet Tails -->
  <g filter="url(#shadowFox)">
    <!-- Left Tail -->
    <path d="M160 250 C110 260 70 210 50 160 C75 180 110 200 150 220 Z" 
          fill="url(#tailGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Center Tail -->
    <path d="M185 260 C150 330 110 320 80 340 C110 300 150 280 175 250 Z" 
          fill="url(#tailGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Right Tail -->
    <path d="M220 250 C280 280 330 240 350 170 C320 200 270 210 225 230 Z" 
          fill="url(#tailGrad)" stroke="#e0f2fe" stroke-width="1.5"/>

    <!-- Fox Body -->
    <ellipse cx="200" cy="250" rx="45" ry="35" fill="url(#foxFur)" stroke="#fed7aa" stroke-width="2"/>
    <ellipse cx="200" cy="255" rx="26" ry="22" fill="#fff7ed"/>

    <!-- Fox Head -->
    <polygon points="140,160 170,110 190,140 210,140 230,110 260,160 200,225" 
             fill="url(#foxFur)" stroke="#fed7aa" stroke-width="2.5"/>

    <!-- White Cheeks -->
    <polygon points="140,160 160,185 185,185 200,220 175,220" fill="#ffffff"/>
    <polygon points="260,160 240,185 215,185 200,220 225,220" fill="#ffffff"/>

    <!-- Inner Ears -->
    <polygon points="150,150 170,120 180,145" fill="#431407"/>
    <polygon points="250,150 230,120 220,145" fill="#431407"/>

    <!-- Little Black Nose -->
    <polygon points="194,216 206,216 200,224" fill="#0c0a09"/>

    <!-- Glowing Astral Eyes -->
    <ellipse cx="175" cy="172" rx="7" ry="10" fill="#0369a1" stroke="#e0f2fe" stroke-width="1.5"/>
    <circle cx="174" cy="170" r="3" fill="#ffffff"/>
    <ellipse cx="225" cy="172" rx="7" ry="10" fill="#0369a1" stroke="#e0f2fe" stroke-width="1.5"/>
    <circle cx="224" cy="170" r="3" fill="#ffffff"/>

    <!-- Forehead Lunar Crescent Rune -->
    <path d="M194 140 C194 130 206 130 206 140 C202 135 198 135 194 140 Z" 
          fill="#38bdf8" stroke="#ffffff" stroke-width="1" filter="drop-shadow(0 0 6px #38bdf8)"/>
  </g>

  <!-- Floating Coins & Stardust -->
  <circle cx="110" cy="110" r="10" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
  <text x="110" y="114" font-family="monospace" font-size="10" font-weight="bold" fill="#451a03" text-anchor="middle">⛁</text>

  <circle cx="290" cy="110" r="10" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
  <text x="290" y="114" font-family="monospace" font-size="10" font-weight="bold" fill="#451a03" text-anchor="middle">⛁</text>

  <polygon points="200,60 203,72 215,75 203,78 200,90 197,78 185,75 197,72" fill="#e0f2fe"/>
</svg>