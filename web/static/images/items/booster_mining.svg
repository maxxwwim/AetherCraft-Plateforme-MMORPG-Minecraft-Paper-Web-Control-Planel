<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="boosterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pickHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadowBooster" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#eab308" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#boosterGlow)"/>

  <g transform="rotate(-30 200 200)" filter="url(#shadowBooster)">
    <!-- Pickaxe Handle -->
    <rect x="192" y="110" width="16" height="200" rx="8" fill="#451a03" stroke="#d97706" stroke-width="2"/>
    <line x1="192" y1="180" x2="208" y2="180" stroke="#fef08a" stroke-width="2"/>
    <line x1="192" y1="230" x2="208" y2="230" stroke="#fef08a" stroke-width="2"/>

    <!-- Celestial Curved Pickaxe Head -->
    <path d="M110 130 C150 90 250 90 290 130 C270 140 250 135 220 130 L200 150 L180 130 C150 135 130 140 110 130 Z" 
          fill="url(#pickHead)" stroke="#fef08a" stroke-width="3"/>

    <!-- Sharp Gem Tips -->
    <polygon points="110,130 90,140 120,145" fill="url(#crystalGrad)" stroke="#a7f3d0" stroke-width="1.5"/>
    <polygon points="290,130 310,140 280,145" fill="url(#crystalGrad)" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Center Multiplier Core -->
    <circle cx="200" cy="130" r="22" fill="#06070b" stroke="#fef08a" stroke-width="3"/>
    <text x="200" y="137" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">x2</text>
  </g>

  <!-- Gold Sparks -->
  <polygon points="200,45 204,57 216,60 204,63 200,75 196,63 184,60 196,57" fill="#fef08a"/>
  <polygon points="90,260 93,270 103,272 93,274 90,284 87,274 77,272 87,270" fill="#eab308"/>
  <polygon points="310,260 313,270 323,272 313,274 310,284 307,274 297,272 307,270" fill="#eab308"/>
</svg>