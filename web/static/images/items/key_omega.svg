<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="omegaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9f1239" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowOmega" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#fb7185" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#omegaGlow)"/>

  <!-- Key Group rotated 45 deg -->
  <g transform="rotate(45 200 200)" filter="url(#shadowOmega)">
    <!-- Omega Sign Bow -->
    <path d="M165 140 C150 120 150 80 180 65 C210 50 250 65 255 100 C258 125 240 140 235 145 L255 145 L255 160 L220 160 C210 160 205 150 200 145 C195 150 190 160 180 160 L145 160 L145 145 L165 145 Z"
          fill="url(#omegaGrad)" stroke="#fff1f2" stroke-width="2.5"/>

    <!-- Central Diamond Gem inside Omega -->
    <polygon points="200,80 215,98 200,116 185,98" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Key Heavy Shaft -->
    <rect x="193" y="165" width="14" height="155" rx="7" fill="#1c1917" stroke="url(#omegaGrad)" stroke-width="3"/>

    <!-- Omega Double Teeth -->
    <path d="M207 240 L245 240 L245 255 L225 255 L225 270 L250 270 L250 290 L225 290 L225 305 L245 305 L245 320 L207 320 Z" 
          fill="url(#omegaGrad)" stroke="#fff1f2" stroke-width="2"/>
  </g>

  <!-- Laser Sparks -->
  <polygon points="200,45 203,57 215,60 203,63 200,75 197,63 185,60 197,57" fill="#ffffff"/>
  <polygon points="320,300 323,310 333,312 323,314 320,324 317,314 307,312 317,310" fill="#fb7185"/>
  <polygon points="80,100 82,108 90,110 82,112 80,120 78,112 70,110 78,108" fill="#38bdf8"/>
</svg>