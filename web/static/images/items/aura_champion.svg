<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#auraGlow)"/>

  <!-- Rotating Concentric Aura Rings -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 8"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="24 12"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#a855f7" stroke-width="3"/>

  <!-- Crown & Diamond Core -->
  <polygon points="200,90 225,145 285,155 240,195 250,255 200,225 150,255 160,195 115,155 175,145" 
           fill="url(#ringGrad)" stroke="#fef08a" stroke-width="3" filter="drop-shadow(0 0 15px #c084fc)"/>
  
  <circle cx="200" cy="180" r="25" fill="#fef08a" filter="drop-shadow(0 0 12px #fff)"/>

  <!-- Cosmic Lightning & Sparks -->
  <polygon points="200,30 206,46 222,50 208,54 200,70 192,54 178,50 194,46" fill="#fef08a"/>
  <polygon points="90,100 94,110 105,112 95,115 90,125 85,115 75,112 86,110" fill="#38bdf8"/>
  <polygon points="310,100 314,110 325,112 315,115 310,125 305,115 295,112 306,110" fill="#38bdf8"/>
</svg>
